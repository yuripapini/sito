    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            background: linear-gradient(135deg, #ffeef2 0%, #ffe0ec 50%, #fff5e6 100%);
            color: #4a3540;
        }
        .container {
            width: 100%;
            max-width: 460px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(231, 76, 60, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.9);
            animation: fadeIn 0.8s ease-out;
        }
        h1 {
            font-family: 'Dancing Script', 'Poppins', cursive;
            font-size: 2.3rem;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #e74c3c, #e84393);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .heart {
            display: inline-block;
            font-size: 1.6rem;
            color: #e74c3c;
            animation: pulse 1.4s ease-in-out infinite;
        }
        .decoration {
            width: 56px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #e84393, transparent);
            margin: 0 auto 16px;
            border-radius: 3px;
        }
        .image-wrapper {
            max-width: 210px;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }
        .image-wrapper img {
            display: block;
            max-width: 100%;
            height: auto;
            transition: transform 0.5s ease;
        }
        .image-wrapper:hover img {
            transform: scale(1.04);
        }
        .caption {
            margin-top: 12px;
            font-size: 0.95rem;
            font-style: italic;
            color: #8a6d7d;
        }
        .cta-text {
            margin-top: 18px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #4a3540;
        }
        .cta-text .arrow {
            display: inline-block;
            font-size: 1.2rem;
            animation: arrowBounce 1s ease-in-out infinite;
        }
        .cta-text .arrow:last-child {
            animation-delay: 0.2s;
        }
        @keyframes arrowBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(6px); }
        }
        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
            padding: 12px 26px;
            background: linear-gradient(135deg, #25D366, #1ebe57);
            color: #ffffff;
            font-size: 0.98rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 10px 26px rgba(37, 211, 102, 0.45);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            animation: pulseBtn 1.6s ease-in-out infinite;
        }
        @keyframes pulseBtn {
            0%, 100% { scale: 1; }
            50% { scale: 1.08; }
        }
        .whatsapp-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 32px rgba(37, 211, 102, 0.55);
        }
        .whatsapp-btn:active {
            transform: translateY(-1px);
        }
        .whatsapp-icon {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 480px) {
            .container {
                padding: 22px 18px;
                border-radius: 20px;
            }
            h1 {
                font-size: 2.1rem;
            }
            .image-wrapper {
                max-width: 175px;
            }
        }
        @media (max-height: 700px) {
            .image-wrapper {
                max-width: 150px;
            }
        }
    </style>
</head>
